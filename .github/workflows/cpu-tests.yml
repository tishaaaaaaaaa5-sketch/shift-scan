name: CPU correctness tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU test dependencies
        run: python -m pip install --upgrade pip torch numpy
      - name: Compile source and experiment scripts
        run: |
          python -m py_compile src/shift_scan_legacy/*.py scripts/summarize_matched_experiment.py
          bash -n scripts/run_matched_experiment.sh
      - name: Run CPU correctness suite
        working-directory: src/shift_scan_legacy
        run: python tests.py
